<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Thank You, AI</title>
  <desc id="desc">An agent skill that turns a genuine closing thank-you into a brief reflection: triage the tier — passing, closing, emphatic, or hollow — and keep only the note that changes tomorrow's first move.</desc>

  <rect width="1200" height="380" rx="28" fill="#FAF1E4"/>

  <!-- subtle divider between identity and proof -->
  <line x1="524" y1="54" x2="524" y2="326" stroke="#E0CFB2" stroke-width="1"/>

  <!-- left: identity -->
  <g transform="translate(64,60)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3" fill="#8C7355">AGENT SKILL</text>

    <text x="0" y="54" font-size="50" font-weight="700" fill="#3B2A1E">Thank You, AI</text>

    <text x="0" y="98" font-size="23" fill="#5C4630">A closing ritual for agent</text>
    <text x="0" y="128" font-size="23" fill="#5C4630">conversations.</text>

    <text x="0" y="172" font-size="17" fill="#8C7355">Reflect once. Keep only the note that</text>
    <text x="0" y="194" font-size="17" fill="#8C7355">changes tomorrow's first move.</text>

    <text x="0" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8C7355">MIT · Claude Code · Codex · any agent</text>
  </g>

  <!-- right: native proof — the triage ladder -->
  <g transform="translate(588,58)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3" fill="#8C7355">TRIAGE, NOT RITUAL</text>

    <line x1="8" y1="34" x2="8" y2="272" stroke="#E0CFB2" stroke-width="2"/>

    <!-- row 0 · passing -->
    <circle cx="8" cy="46" r="6" fill="#B7A583"/>
    <text x="34" y="52" font-size="20" font-weight="700" fill="#8C7355">0 · Passing</text>
    <text x="34" y="76" font-size="16" fill="#A0916F">thanks + a new ask — keep working</text>

    <!-- row 1 · closing -->
    <circle cx="8" cy="120" r="6" fill="#C1702E"/>
    <text x="34" y="126" font-size="20" font-weight="700" fill="#3B2A1E">1 · Closing</text>
    <text x="34" y="150" font-size="16" fill="#8C7355">stands alone — reflect, then close</text>

    <!-- row 2 · emphatic -->
    <circle cx="8" cy="194" r="6" fill="#A67C2E"/>
    <text x="34" y="200" font-size="20" font-weight="700" fill="#3B2A1E">2 · Emphatic</text>
    <text x="34" y="224" font-size="16" fill="#8C7355">unusually useful — log a candidate</text>

    <!-- row 1- · hollow -->
    <circle cx="8" cy="268" r="6" fill="#8B4632"/>
    <text x="34" y="274" font-size="20" font-weight="700" fill="#3B2A1E">1− · Hollow</text>
    <text x="34" y="298" font-size="16" fill="#8C7355">gives up anyway — capture the miss</text>
  </g>
</svg>
